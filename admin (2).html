/* ===== ADMIN PRO · premium layer ===== */
:root{--fb:"Plus Jakarta Sans",Inter,system-ui,sans-serif;--fd:"Sora","Plus Jakarta Sans",sans-serif;--fm:"JetBrains Mono",ui-monospace,Menlo,monospace;--hv:color-mix(in srgb,var(--tx) 6%,transparent);--pu3:#c04bff;--bt:#fff;--ring:color-mix(in srgb,var(--pu) 30%,transparent)}
[data-accent=gold]{--pu:#e5a82a;--pu2:#f7d27a;--pu3:#ff8f3d;--bt:#1b1405}
[data-accent=emerald]{--pu:#10b981;--pu2:#6ee7b7;--pu3:#14b8a6;--bt:#04150f}
[data-accent=rose]{--pu:#f43f5e;--pu2:#fda4af;--pu3:#ec4899}
[data-accent=cyan]{--pu:#06b6d4;--pu2:#67e8f9;--pu3:#3b82f6;--bt:#031519}
[data-theme=dark]{--bg:#06070d;--bg2:#0a0c16;--cd:#0f1220;--cd2:#141830}
body{font-family:var(--fb);font-size:14px;letter-spacing:-.004em;background:radial-gradient(1000px 540px at 88% -14%,color-mix(in srgb,var(--pu) 24%,transparent),transparent 62%),radial-gradient(800px 460px at -8% 108%,color-mix(in srgb,var(--pu3) 13%,transparent),transparent 60%),var(--bg)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(var(--ln) 1px,transparent 1px),linear-gradient(90deg,var(--ln) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at 75% 0,#000,transparent 62%);mask-image:radial-gradient(ellipse at 75% 0,#000,transparent 62%);opacity:.45}
.shell,main,aside{position:relative;z-index:1}
h1,h2,h3,h4{font-family:var(--fd)}
::-webkit-scrollbar-thumb{background:var(--ln2);border-radius:8px}
.mu{color:var(--mu)}.sm{font-size:11.5px}.mono{font-family:var(--fm);font-size:11px;color:var(--mu);display:block;letter-spacing:0}

/* sidebar */
.shell{grid-template-columns:268px 1fr;transition:grid-template-columns .25s ease}
.shell.col{grid-template-columns:78px 1fr}
aside{background:linear-gradient(180deg,color-mix(in srgb,var(--bg2) 94%,transparent),var(--bg2));padding:16px 12px;border-right:1px solid var(--ln)}
.lg i{background:linear-gradient(135deg,var(--pu),var(--pu3));box-shadow:0 10px 26px -8px var(--pu);color:var(--bt)}

.nv{position:relative}.nv:hover{background:var(--hv)}

.nv.on:before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 4px 4px 0;background:var(--pu);box-shadow:0 0 12px var(--pu)}

/* topbar */

<div class="fgrid"><label>Organization name<input data-oi2="${i}:n" value="${esc(o.n)}" maxlength="40"></label><label>Type<select data-oi2="${i}:t"><option value="state" ${o.t!="crime"?"selected":""}>State</option><option value="crime" ${o.t=="crime"?"selected":""}>Crime</option></select></label><label>Name colour<input type="color" data-oi2="${i}:c" value="${c}" style="height:38px;padding:2px"></label><label class="w2">Questions for this organization (one per line). Empty = same questions as the Leader Application<textarea data-oi2="${i}:q" rows="5" placeholder="Empty = Leader Application questions">${esc(o.q||"")}</textarea></label><details style="margin-top:6px"><summary style="cursor:pointer;font-weight:600">Question format guide (kaise likhna hai)</summary><div style="font-size:12.5px;line-height:1.7;margin-top:6px;opacity:.9">Har line = ek question. Question ke aakhir me ek chhota code lagao:<br>

document.addEventListener("input",e=>{const t=e.target,d=t.dataset&&t.dataset.oi2;if(!d)return;const[i,k]=d.split(":"),o=ogs()[+i];if(!o)return;
if(k=="open")o.open=t.checked;else o[k]=t.value;
const r=t.closest("[data-oi]");if(!r)return;const c=hxc(o.c),p=r.querySelector("[data-op]"),st=r.querySelector("[data-os]"),l=t.closest("label.pm");
r.style.borderLeftColor=c;p.style.setProperty("--c",c);p.textContent=o.n||"Name";st.style.setProperty("--c",o.open?"#34d399":"#f87171");st.textContent=o.open?"Open":"Closed";if(l)l.classList.toggle("y",!!o.open)});
document.addEventListener("click",e=>{const x=e.target.closest("[data-og]");if(!x)return;const[k,n]=x.dataset.og.split(":"),O=ogs();
if(k=="add"){O.push({id:"o"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),n:"New organization",t:"state",c:"#7c5cff",open:true});draw();return}
if(k=="del"){if(confirm("Delete this organization? Applications already posted stay in the forum, but the organization disappears from the Apply page.")){O.splice(+n,1);draw()}return}
if(k=="all"){O.forEach(o=>o.open=n=="1");draw();return}
if(k=="save"){if(!P.edit)return toast("You need the Edit site permission");
const L=O.map(o=>({id:String(o.id).replace(/[^\w-]/g,"").slice(0,24),n:String(o.n||"").trim().slice(0,40),t:o.t=="crime"?"crime":"state",c:hxc(o.c),open:!!o.open,q:String(o.q||"").split("\n").map(x=>x.trim().slice(0,300)).filter(Boolean).slice(0,60)}));
if(L.some(o=>!o.n||!o.id))return toast("Every organization needs a name");
if(new Set(L.map(o=>o.n.toLowerCase())).size!=L.length)return toast("Two organizations have the same name");
if(L.length>60)return toast("Maximum 60 organizations");
run(()=>setDoc(doc(db,"config","site"),{orgs:L},{merge:true}),"Organizations saved")}});
