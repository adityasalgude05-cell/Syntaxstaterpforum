<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Syntax State RP | Forum</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--pu:#3b2f8f;--pu2:#2b2270;--ye:#f5b800;--bg:#f3f4f8;--tx:#1d1f2b;--mu:#7b7f93;--ln:#e4e6ee}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 Rubik,sans-serif;background:var(--bg);color:var(--tx)}
a{color:inherit;text-decoration:none}small{display:block;color:var(--mu);font-size:12px}
header{background:var(--pu);color:#fff;display:flex;align-items:center;gap:20px;padding:0 16px;height:52px;position:sticky;top:0;z-index:5}
header img{width:34px;height:34px;border-radius:50%;object-fit:cover}header b{font-weight:700}
header nav{display:flex;gap:16px;flex:1;font-size:12px;opacity:.9}header nav a:hover{text-decoration:underline}header b,#nr{white-space:nowrap}header nav{align-items:center;min-width:0}
#nr{display:flex;gap:10px;align-items:center;font-size:13px}
.hero{background-size:cover;background-position:center;color:#fff;padding:56px 20px}.hero h1{margin:0;font-size:34px}.hero p{margin:6px 0 0;opacity:.85}
.wrap{display:grid;grid-template-columns:1fr 280px;gap:18px;max-width:1100px;margin:18px auto;padding:0 12px}
.wrap1{max-width:1100px;margin:18px auto;padding:0 12px}
@media(max-width:800px){.wrap{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--ln);border-radius:6px;overflow:hidden;margin-bottom:12px}
.sec{margin:14px 0 8px;font-size:15px}
.row{display:flex;gap:12px;padding:12px 14px;border-top:1px solid var(--ln);align-items:center}.row:first-child{border-top:0}.row:hover,.tr:hover,.lp:hover{background:#f8f8fd}
.ic{width:30px;height:30px;border-radius:50%;background:#ece9fb;display:grid;place-items:center}
.tr{display:grid;grid-template-columns:1fr 64px 64px;gap:8px;padding:10px 14px;border-top:1px solid var(--ln);align-items:center}
.tr.hd{color:var(--mu);font-size:12px;border-top:0}.lp{display:block;padding:10px 14px;border-top:1px solid var(--ln)}.lp:first-child{border-top:0}
.bar{display:flex;justify-content:space-between;align-items:center;margin:10px 0}.bar h2,.card h2{margin:0}
.crumb{color:var(--mu);font-size:12px}.crumb a:hover{text-decoration:underline}
.btn{background:var(--ye);color:#1d1f2b;border:0;border-radius:4px;padding:9px 16px;font:700 12px Rubik,sans-serif;cursor:pointer;display:inline-block}.btn:hover{filter:brightness(.95)}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px;margin-right:6px;color:#fff;background:#888;vertical-align:1px}
.tag.pending{background:var(--ye);color:#1d1f2b}.tag.approved{background:#1fa64a}.tag.rejected{background:#d93636}.tag.important{background:#e0307e}
input,textarea,select{width:100%;padding:10px;margin:0 0 10px;border:1px solid var(--ln);border-radius:4px;font:inherit;background:#fff}
.post{display:flex}.au{width:130px;padding:14px;background:#fafafd;border-right:1px solid var(--ln);text-align:center;flex:none}
.av{width:52px;height:52px;border-radius:50%;background:var(--pu);color:#fff;display:grid;place-items:center;font-size:20px;margin:0 auto 6px}
.bd{padding:14px;flex:1;min-width:0}.tx{white-space:pre-wrap;word-wrap:break-word;margin-top:8px}
@media(max-width:600px){.post{display:block}.au{width:auto;border:0;text-align:left;display:flex;gap:10px;align-items:center}.av{margin:0;width:36px;height:36px;font-size:15px}}
@media(max-width:600px){header{gap:8px;padding:0 8px}header b{font-size:12px}header nav{gap:8px;font-size:11px}header nav input{width:70px!important}#nr span{display:none}}
.empty,.load{padding:20px;color:var(--mu)}
</style></head><body>

const post=p=>`<div class="card post"><div class="au"><div class="av">${esc((p.author||"?")[0].toUpperCase())}</div><b>${esc(p.author)}</b></div><div class="bd"><small>${fmt(p.ts)}</small><div class="tx">${esc(p.body)}</div></div></div>`;
const c=cat(t.cat)||{n:"Forum"};
app.innerHTML=`<div class="wrap1"><div class="crumb"><a href="#/">Forums</a> › <a href="#/f/${t.cat}">${esc(c.n)}</a></div><div class="bar"><h2>${tag(t.prefix)}${esc(t.title)}</h2>${staff()?`<select id="pf" style="width:auto;margin:0">${["","Pending","Approved","Rejected","Important"].map(p=>`<option ${p==t.prefix?"selected":""} value="${p}">${p||"No prefix"}</option>`).join("")}</select>`:""}</div>${post(t)}${ps.docs.map(d=>post(d.data())).join("")}${user?`<div class="card" style="padding:14px"><textarea id="rb" rows="5" placeholder="Write a reply…"></textarea><button class="btn" id="rs">POST REPLY</button></div>`:'<div class="card empty"><a href="#/login"><b>Log in</b></a> to reply.</div>'}</div>`;
$("#pf")?.addEventListener("change",async e=>{await updateDoc(r,{prefix:e.target.value});route()});
$("#rs")?.addEventListener("click",async()=>{const body=$("#rb").value.trim();if(!body)return;
await addDoc(collection(r,"posts"),{body,uid:user.uid,author:user.displayName||"Member",ts:serverTimestamp()});
await updateDoc(r,{replies:increment(1)});route()})}

function newThread(id){const c=cat(id);if(!c)return home();if(!user){location.hash="#/login";return}
app.innerHTML=`<div class="wrap1"><div class="crumb"><a href="#/">Forums</a> › <a href="#/f/${id}">${esc(c.n)}</a></div><div class="card" style="padding:18px;margin-top:10px"><h2 style="margin-bottom:12px">Post thread</h2><input id="ti" maxlength="120" placeholder="Thread title">${(FORMS[id]||[]).map(f=>`<label><small>${esc(f)}</small><input class="ff" data-l="${esc(f)}"></label>`).join("")}<textarea id="bo" rows="8" placeholder="${FORMS[id]?"Additional details":"Write your post…"}"></textarea><button class="btn" id="go">POST THREAD</button></div></div>`;
$("#go").onclick=async()=>{const title=$("#ti").value.trim(),ff=[...document.querySelectorAll(".ff")];if(ff.some(i=>!i.value.trim()))return alert("Fill in all fields.");const body=[...ff.map(i=>i.dataset.l+": "+i.value.trim()),$("#bo").value.trim()].filter(Boolean).join("\n");if(!title||!body)return alert("Add a title and some text.");
const r=await addDoc(collection(db,"threads"),{cat:id,title,body,prefix:PRE.includes(id)?"Pending":"",uid:user.uid,author:user.displayName||"Member",ts:serverTimestamp(),replies:0,views:0});location.hash="#/t/"+r.id}}

async function members(){const s=await getDocs(query(collection(db,"users"),limit(200)));
app.innerHTML=`<div class="wrap1"><div class="bar"><h2>Members</h2></div><div class="card">${s.docs.map(d=>{const u=d.data();return`<a class="row" href="#/u/${d.id}"><span class="av" style="margin:0;width:34px;height:34px;font-size:14px">${esc((u.name||"?")[0].toUpperCase())}</span><b>${esc(u.name)}</b>${u.role!="member"?`<span class="tag important">${esc(u.role)}</span>`:""}</a>`}).join("")||'<p class="empty">No members yet.</p>'}</div></div>`}
async function profile(id){const u=(await getDoc(doc(db,"users",id))).data();if(!u)return members();
const s=await getDocs(query(collection(db,"threads"),where("uid","==",id),limit(50)));
app.innerHTML=`<div class="wrap1"><div class="card" style="padding:18px;display:flex;gap:14px;align-items:center"><div class="av" style="margin:0">${esc((u.name||"?")[0].toUpperCase())}</div><div><h2>${esc(u.name)}</h2>${u.role!="member"?`<span class="tag important">${esc(u.role)}</span>`:""}</div></div><h3 class="sec">Threads</h3><div class="card">${s.docs.map(d=>`<a class="lp" href="#/t/${d.id}">${tag(d.data().prefix)}<b>${esc(d.data().title)}</b></a>`).join("")||'<p class="empty">No threads yet.</p>'}</div></div>`}
async function admin(){if(!high()){location.hash="#/";return}
const s=await getDocs(query(collection(db,"users"),limit(200)));
app.innerHTML=`<div class="wrap1"><div class="bar"><h2>Admin panel</h2></div><div class="card">${s.docs.map(d=>`<div class="row"><b style="flex:1">${esc(d.data().name)}</b><select data-u="${d.id}" style="width:auto;margin:0">${RANKS.map(r=>`<option ${r==d.data().role?"selected":""}>${r}</option>`).join("")}</select></div>`).join("")}</div></div>`;
app.querySelectorAll("select[data-u]").forEach(x=>x.onchange=async()=>{await updateDoc(doc(db,"users",x.dataset.u),{role:x.value});alert("Rank updated")})}
async function search(q){q=decodeURIComponent(q||"").toLowerCase();
const s=await getDocs(query(collection(db,"threads"),orderBy("ts","desc"),limit(300)));
const r=s.docs.filter(d=>(d.data().title+" "+d.data().body).toLowerCase().includes(q));
app.innerHTML=`<div class="wrap1"><div class="bar"><h2>Search: ${esc(q)}</h2></div><div class="card">${r.map(d=>`<a class="lp" href="#/t/${d.id}">${tag(d.data().prefix)}<b>${esc(d.data().title)}</b><small>${esc(d.data().author)}, ${fmt(d.data().ts)}</small></a>`).join("")||'<p class="empty">No results. Try another word.</p>'}</div></div>`}
function login(){let reg=false;
app.innerHTML=`<div class="wrap1"><div class="card" style="padding:20px;max-width:420px;margin:30px auto"><h2 id="h" style="margin-bottom:12px">Log in</h2><input id="nm" placeholder="Nickname" style="display:none"><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password (6+ characters)"><button class="btn" id="go">LOG IN</button><p><a href="#" id="sw" style="color:var(--pu)">Create an account</a></p></div></div>`;
$("#sw").onclick=e=>{e.preventDefault();reg=!reg;$("#nm").style.display=reg?"":"none";$("#h").textContent=reg?"Create account":"Log in";$("#go").textContent=reg?"REGISTER":"LOG IN";$("#sw").textContent=reg?"I already have an account":"Create an account"};
$("#go").onclick=async()=>{const em=$("#em").value.trim(),pw=$("#pw").value,nm=$("#nm").value.trim();
try{if(reg){if(!nm)return alert("Choose a nickname.");const c=await createUserWithEmailAndPassword(auth,em,pw),r0=DEMO&&c.user.first?"Curator of Project":"member";await updateProfile(c.user,{displayName:nm});await setDoc(doc(db,"users",c.user.uid),{name:nm,role:r0});role=r0;nav()}
else await signInWithEmailAndPassword(auth,em,pw);location.hash="#/"}catch(e){alert(e.message)}}}
nav();route();
</script></body></html>
