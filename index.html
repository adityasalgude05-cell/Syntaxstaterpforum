/* ===== v7: refined lines/outlines, softer depth, Fury font stack ===== */
/* Fury: uses the installed font if present. To embed it, add: src:url(fury.woff2) format("woff2") below */
@font-face{font-family:"Fury";font-display:swap;src:local("Fury"),local("Fury Regular"),local("Fury-Regular")}
:root{--font:"Fury",Barlow,Rubik,system-ui,-apple-system,"Segoe UI",sans-serif;--line:#e6e8f1;--line2:#eef0f7;--r:14px;--sh:0 1px 2px rgba(23,26,60,.04),0 10px 28px -14px rgba(23,26,60,.14)}
*{font-family:var(--font)!important}
.cd,.wy .cd,.pb .cd,code,pre,kbd,samp{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace!important}
html{scroll-behavior:smooth}
body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::selection{background:#ddd8ff;color:#1d1f2b}
*{scrollbar-width:thin;scrollbar-color:#d3d6e6 transparent}
/* header lines */
header{box-shadow:0 1px 0 #e8e9f1,0 12px 26px -20px rgba(23,26,60,.45)!important}
header nav a:nth-child(2)::after{height:3px;border-radius:3px 3px 0 0;left:14px;right:14px}
header .ico{transition:background .18s,color .18s,transform .18s}header .ico:active{transform:scale(.94)}
/* cards */
.card,.pc,.tc,.fd,.ab{border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card{overflow:hidden}
.tb{border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
/* inset hairline dividers instead of full-bleed lines */
.row.frw{position:relative;border-top:0;transition:background .18s,box-shadow .18s}
.row.frw+.row.frw::before{content:"";position:absolute;top:0;left:26px;right:26px;height:1px;background:var(--line2)}
.row.frw:hover{background:linear-gradient(90deg,#f7f6ff,#fcfcff);box-shadow:inset 3px 0 0 var(--brand)}
.rs+.rs::before{border-left:0;width:1px;height:52px;background:linear-gradient(transparent,#dcdfec 30%,#dcdfec 70%,transparent)}
/* icon tile */
.frw .ic{width:46px;height:46px;border-radius:13px;background:linear-gradient(180deg,#f6f7fd,#eef0fa);border:1px solid #e6e9f5;display:grid;place-items:center;color:#6674a0;margin-right:22px;transition:background .18s,color .18s,border-color .18s}
.frw .ic svg{width:25px;height:25px}
.row.frw:hover .ic{background:var(--brand);border-color:var(--brand);color:#fff}
/* group chevron */
.chev{border:1.5px solid #cfd3e4;background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(23,26,60,.06)}
.chev:hover{background:var(--brand);border-color:var(--brand);color:#fff}
/* toolbar + buttons */
.tbl a{position:relative;padding:6px 0}
.tbl a::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:2px;background:var(--brand);transform:scaleX(0);transform-origin:left;transition:transform .2s}
.tbl a:hover::after{transform:scaleX(1)}.tbl a .cdn{margin-left:2px}
.tbr .btn{border:0;background:linear-gradient(180deg,#ffd44d,#f7b818);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -2px 0 rgba(0,0,0,.07),0 1px 2px rgba(150,100,0,.25),0 8px 16px -8px rgba(247,184,24,.8);transition:transform .15s,box-shadow .15s,filter .15s}
.tbr .btn:hover{transform:translateY(-1px);filter:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -2px 0 rgba(0,0,0,.07),0 2px 4px rgba(150,100,0,.25),0 12px 20px -8px rgba(247,184,24,.9)}
.tbr .btn:active{transform:translateY(0)}
.tbr .btn.g{background:#fff;box-shadow:inset 0 0 0 1px var(--line),0 1px 2px rgba(23,26,60,.05)}
.btn{box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 1px 2px rgba(150,100,0,.22),0 6px 14px -8px rgba(247,184,24,.8)}
.btn.g{box-shadow:inset 0 0 0 1px var(--line),0 1px 2px rgba(23,26,60,.05)}
/* tags: crisp inner edge */
.tag{box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);line-height:1.5}
/* sidebar */
.lpc .lp{position:relative;border-radius:10px;padding:10px 10px!important;margin:0 -10px;transition:background .15s}
.lpc .lp:hover{background:#f7f6ff}
.lpc .lp+.lp::before{content:"";position:absolute;top:0;left:10px;right:10px;height:1px;background:var(--line2)}
.lpc .lp:hover::before,.lpc .lp:hover+.lp::before{opacity:0}
aside .mec{background:linear-gradient(180deg,#fff,#fbfbff)}
aside .mec .av{box-shadow:0 0 0 3px #fff,0 0 0 4px #dcdff0,0 6px 14px -6px rgba(23,26,60,.35)}
.av{box-shadow:0 0 0 2px #fff,0 0 0 3px #e1e4f2}
.od{border-color:#fff}
/* forms */
input,textarea,select{border:1px solid var(--line);border-radius:12px;box-shadow:inset 0 1px 2px rgba(23,26,60,.03)}
input:hover,textarea:hover,select:hover{border-color:#d4d8ea}
input:focus,textarea:focus,select:focus{border-color:#6c5ce7;box-shadow:0 0 0 4px rgba(108,92,231,.14)}
/* other lined elements */
.tl{border-top:1px solid var(--line2)}.tl.hd{border-top:0;background:#fafbff}
.fbar{border-bottom:1px solid var(--line2)}
.crumb{border:1px solid var(--line)}
.pa,.pside,.lvl,.ipb{border-color:var(--line)}
.ab a{border-left-color:var(--line2)}
footer{border-top:1px solid rgba(255,255,255,.06)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
