app.innerHTML=`<div class="wrap1"><div class="bar"><h2>Admin panel</h2></div>${me.edit?'<div id="sx"></div><h3 class="sec">Sections &amp; forums</h3><div class="card" id="fg"></div><button class="btn g" id="fa">+ Add forum / section</button> <button class="btn" id="fs">SAVE FORUMS</button><h3 class="sec">Ranks &amp; permissions</h3><div class="card" id="rk"></div><button class="btn g" id="ra">+ Add rank</button> <button class="btn" id="rs">SAVE RANKS</button>':""}<h3 class="sec">Archive</h3><button class="btn g" id="ar">Move old Approved/Rejected threads to archives</button><h3 class="sec">Staff online now</h3><div class="card ol2">${L.filter(u=>onl(u.id)&&rk(u.role)>0).map(u=>`${un(u.id,u.name)} <small>(${esc(u.role)})</small>`).join("<br>")||"<small>No staff online.</small>"}</div><h3 class="sec">Members (${L.length})</h3><div class="card">${L.map(u=>{const k=RK.find(r=>r.id==u.rid);return`<div class="row">${av(u.id,u.name,34)}<b style="flex:1;color:${col(u.role)}">${esc(u.name)}</b><select data-u="${u.id}" style="width:auto;margin:0" ${!can(k)||u.id==user.uid?"disabled":""}>${RK.filter(r=>can(r)||r==k).map(r=>`<option value="${r.id}" ${r==k?"selected":""}>${esc(r.n)}</option>`).join("")}</select></div>`}).join("")}</div></div>`;
if(me.edit){siteAdmin();const ck=(i,k,l,v,a)=>`<label style="font-size:12px;display:flex;gap:6px;align-items:center"><input type="checkbox" style="width:auto;margin:0" data-i="${i}" data-${a}="${k}" ${v?"checked":""}>${l}</label>`;
const rr=()=>$("#rk").innerHTML=E.map((r,i)=>`<div class="row" style="flex-wrap:wrap"><input data-i="${i}" data-k="n" value="${esc(r.n)}" style="flex:1;min-width:150px;margin:0"><input type="color" data-i="${i}" data-k="c" value="${r.c}" style="width:44px;margin:0;padding:2px">${P.map(([k,l])=>ck(i,k,l,r[k],"k")).join("")}${i>1?`<button class="btn g" data-mv="${i}">↑</button>`:""}${i&&r.id!="cop"?`<button class="btn g" data-rm="${i}">✕</button>`:""}</div>`).join("");rr();
const rf=()=>$("#fg").innerHTML=G.map((x,i)=>`<div class="row" style="flex-wrap:wrap;gap:8px;align-items:flex-start"><div style="flex:1;min-width:220px;display:grid;gap:6px"><input data-i="${i}" data-g="n" value="${esc(x.n)}" placeholder="Forum name" style="margin:0"><input data-i="${i}" data-g="d" value="${esc(x.d||"")}" placeholder="Description" style="margin:0"><input data-i="${i}" data-g="url" value="${esc(x.url||"")}" placeholder="Link URL (https://…) turns this into a link row, not a forum" style="margin:0">${x.p?"":`<input data-i="${i}" data-g="g" list="gl" value="${esc(x.g||"")}" placeholder="Section name (new name = new section)" style="margin:0">`}<select data-i="${i}" data-g="p" style="margin:0"><option value="">Top-level forum</option>${G.filter(y=>!y.p&&y!=x).map(y=>`<option value="${y.id}" ${x.p==y.id?"selected":""}>Sub-forum of: ${esc(y.n)}</option>`).join("")}</select></div><div style="flex:1;min-width:220px;display:grid;gap:6px">${ck(i,"ro","Staff-only posting",x.ro,"g")}${ck(i,"pre","Approval workflow (Pending review + Archive)",x.pre,"g")}<textarea data-i="${i}" data-g="ntc" rows="2" placeholder="Notice on top (optional)" style="margin:0">${esc(x.ntc||"")}</textarea><textarea data-i="${i}" data-g="fields" rows="3" placeholder="Required fields, one per line: Label~help  |  Label:date  |  Label|opt1,opt2" style="margin:0">${esc(x.fields||"")}</textarea></div><span>${i?`<button class="btn g" data-gm="${i}">↑</button>`:""}<button class="btn g" data-gd="${i}">✕</button></span></div>`).join("")+`<datalist id="gl">${[...new Set(G.map(y=>y.g).filter(Boolean))].map(g=>`<option value="${esc(g)}">`).join("")}</datalist>`;rf();
const R=$("#rk"),Fg=$("#fg");
R.oninput=e=>{const i=e.target.dataset.i,k=e.target.dataset.k;if(k)E[i][k]=e.target.type=="checkbox"?e.target.checked:e.target.value};
Fg.oninput=e=>{const i=e.target.dataset.i,k=e.target.dataset.g;if(!k)return;G[i][k]=e.target.type=="checkbox"?e.target.checked:e.target.value;if(k=="p")rf()};
R.onclick=e=>{const m=e.target.dataset.mv,d=e.target.dataset.rm;if(m){[E[m-1],E[m]]=[E[m],E[m-1]];rr()}if(d&&confirm("Delete this rank? Members with it become Player.")){E.splice(d,1);rr()}};
Fg.onclick=e=>{const m=e.target.dataset.gm,d=e.target.dataset.gd;if(m){[G[m-1],G[m]]=[G[m],G[m-1]];rf()}if(d&&confirm("Delete this forum? Its threads stay in the database but disappear from the site.")){const x=G.splice(d,1)[0];G.forEach(y=>{if(y.p==x.id)y.p=""});rf()}};
$("#fa").onclick=()=>{G.push({id:"f"+Date.now().toString(36),n:"New forum",d:"",g:G.at(-1)?.g||"General",p:"",ro:false,pre:false,ntc:"",fields:""});rf()};
$("#ra").onclick=()=>{E.push({id:"r"+Date.now().toString(36),n:"New rank",c:"#1d1f2b"});rr()};
$("#fs").onclick=async()=>{if(G.some(x=>!String(x.n).trim()))return alert("Every forum needs a name.");const f={};G.forEach((x,i)=>f[x.id]={n:x.n.trim(),d:x.d||"",g:x.p?"":String(x.g||"General").trim(),p:x.p||"",ro:!!x.ro,pre:!!x.pre,ntc:x.ntc||"",url:ok(String(x.url||"").trim()),fields:String(x.fields||"").split("\n").map(t=>t.trim()).filter(Boolean),o:i});try{await setDoc(doc(db,"config","forums"),{f});await loadFC();await loadT(1);alert("Forums saved");route(1)}catch(e){alert("Could not save: "+e.message)}};
$("#rs").onclick=async()=>{if(E.some(r=>!String(r.n).trim()))return alert("Every rank needs a name.");const r={};E.forEach((x,i)=>r[x.id]={n:x.n.trim(),c:x.c,lv:i,mod:!!x.mod,move:!!x.move,adm:!!x.adm,edit:!!x.edit});try{await setDoc(doc(db,"config","ranks"),{r});await loadRK();await loadU();me=rkOf(UM[user.uid]);nav();alert("Ranks saved");route(1)}catch(e){alert("Could not save: "+e.message)}}}
$("#ar").onclick=async()=>{await loadT(1);let n=0;for(const t of TH){const a=arcOf(t.cat);if(["Approved","Rejected"].includes(t.prefix)&&a){await updateDoc(doc(db,"threads",t.id),{cat:a});n++}}await loadT(1);alert(n+" threads archived")};
app.querySelectorAll("select[data-u]").forEach(x=>x.onchange=async()=>{try{await updateDoc(doc(db,"users",x.dataset.u),{rid:x.value,role:RK.find(r=>r.id==x.value).n});await loadU();alert("Rank updated")}catch(e){alert("Could not update: "+e.message)}})}

setInterval(async()=>{if(document.hidden||!$("#ob"))return;await loadU();$("#ob").innerHTML=onlineBox()},60000);setInterval(()=>loadCV(),60000);applySite();
